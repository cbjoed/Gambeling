name: Build, Push, and Deploy Docker Image

on:
  push:
    branches:
      - main  # Trigger this action on push to the 'main' branch (or any branch you want)

jobs:
  build:
    runs-on: ubuntu-latest  # This will run on the latest version of Ubuntu

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2  # This checks out the code in your repository

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}  # GitHub Secret for Docker username
        password: ${{ secrets.DOCKER_PASSWORD }}  # GitHub Secret for Docker password

    - name: Build Docker image
      run: |
        docker build -t cbjoedstrup/gambling-bot .  # Build the Docker image
        docker tag cbjoedstrup/gambling-bot cbjoedstrup/gambling-bot:latest  # Tag the image

    - name: Push Docker image to Docker Hub
      run: |
        docker push cbjoedstrup/gambling-bot  # Push the image to Docker Hub
        docker push cbjoedstrup/gambling-bot:latest  # Push the tagged image

    - name: Deploy to Azure Container Instances
      uses: azure/aci-deploy@v1
      with:
        resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}  # GitHub Secret for Azure resource group
        dns-name-label: gambling-bot  # DNS name for the container instance
        image: cbjoedstrup/gambling-bot:latest  # Image to deploy from Docker Hub
        registry-login-server: index.docker.io  # Docker Hub login server
        registry-username: ${{ secrets.DOCKER_USERNAME }}  # Docker Hub username
        registry-password: ${{ secrets.DOCKER_PASSWORD }}  # Docker Hub password
        name: gambling-bot  # Name of the container instance
        location: eastus  # Location of the container instance
        ports: 80  # Ports to expose