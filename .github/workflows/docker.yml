name: Build and Push Docker Image

on:
  push:
    branches:
      - main  # Trigger this action on push to the 'main' branch (or any branch you want)

jobs:
  build:
    runs-on: ubuntu-latest  # This will run on the latest version of Ubuntu

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2  # This checks out the code in your repository

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}  # GitHub Secret for Docker username
        password: ${{ secrets.DOCKER_PASSWORD }}  # GitHub Secret for Docker password

    - name: Build Docker image
      run: |
        docker build -t cbjoedstrup/discord-bot .  # Build the Docker image
        docker tag cbjoedstrup/discord-bot cbjoedstrup/discord-bot:latest  # Tag the image

    - name: Push Docker image to Docker Hub
      run: |
        docker push cbjoedstrup/discord-bot  # Push the image to Docker Hub
        docker push cbjoedstrup/discord-bot:latest  # Push the tagged image
